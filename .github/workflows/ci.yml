name: CI
on:
  pull_request:
  push:
    branches-ignore: [main] # main'de aynı testler deploy.yml içinde dağıtımdan önce çalışır
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx astro check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test
